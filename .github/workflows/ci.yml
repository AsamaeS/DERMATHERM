name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================== FRONTEND ====================
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Lint check
        run: npm run lint --if-present
      
      - name: 🏗️ Build frontend
        run: npm run build
      
      - name: ✅ Run tests
        run: npm test --if-present
      
      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ==================== BACKEND ====================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: 🔍 Lint check
        working-directory: backend
        run: npm run lint --if-present
      
      - name: 🏗️ Build backend
        working-directory: backend
        run: npm run build
      
      - name: ✅ Run tests
        working-directory: backend
        run: npm test --if-present
      
      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # ==================== DOCKER ====================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: dermatherm-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🏗️ Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: dermatherm-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🧪 Test docker-compose
        run: |
          cp .env.example .env
          docker-compose config

  # ==================== TYPE CHECK ====================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install frontend dependencies
        run: npm ci
      
      - name: 🔍 TypeScript check (frontend)
        run: npx tsc --noEmit
      
      - name: 📦 Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: 🔍 TypeScript check (backend)
        working-directory: backend
        run: npx tsc --noEmit

  # ==================== STATUS ====================
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker, typecheck]
    if: always()
    
    steps:
      - name: ✅ All checks passed
        if: ${{ needs.frontend.result == 'success' && needs.backend.result == 'success' && needs.docker.result == 'success' && needs.typecheck.result == 'success' }}
        run: echo "✅ All CI checks passed successfully!"
      
      - name: ❌ Some checks failed
        if: ${{ needs.frontend.result != 'success' || needs.backend.result != 'success' || needs.docker.result != 'success' || needs.typecheck.result != 'success' }}
        run: |
          echo "❌ Some CI checks failed:"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          exit 1
